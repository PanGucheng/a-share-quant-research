name: research-validation-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lightweight-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lightweight validation dependencies
        shell: pwsh
        run: >-
          python -m pip install
          "pandas>=2.3,<2.4"
          "numpy>=2.2,<2.3"
          "pandera[pandas]>=0.32,<0.33"
          "PyYAML>=6,<7"
          "pytest>=9,<10"
      - name: Run schema and configuration tests
        shell: pwsh
        run: >-
          python -m pytest
          tests/test_output_schemas.py
          tests/test_config_parsing.py
          tests/test_imports.py
          -q
      - name: Run synthetic contract validator
        shell: pwsh
        run: python scripts/validate_research_data_contracts_v1.py
