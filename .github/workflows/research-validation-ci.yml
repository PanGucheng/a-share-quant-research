name: research-validation-ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lightweight-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-research-validation.txt
      - name: Install lightweight validation dependencies
        shell: pwsh
        run: >-
          python -m pip install
          "pandas>=2.3,<2.4"
          "numpy>=2.2,<2.3"
          "scipy>=1.15,<1.16"
          "statsmodels>=0.14,<0.15"
          "pandera[pandas]>=0.32,<0.33"
          "PyYAML>=6,<7"
          "pytest>=9,<10"
          "pyarrow>=18,<24"
      - name: Run complete research validation test suite
        shell: pwsh
        run: python -m pytest -q
      - name: Run synthetic contract validator
        shell: pwsh
        run: |
          python scripts/validate_research_data_contracts_v1.py
          python scripts/validate_point_in_time_universe_v1.py
          python scripts/validate_point_in_time_universe_v2.py
          python scripts/validate_purged_walk_forward_v1.py
          python scripts/validate_factor_multiple_testing_v1.py
          python scripts/validate_factor_rolling_stability_v1.py
          python scripts/validate_factor_clustering_v1.py
          python scripts/validate_factor_score_construction_v1.py
          python scripts/validate_a_share_execution_v1.py
          python scripts/validate_external_exposure_data_v1.py
          python scripts/validate_final_portfolio_diagnostics_v1.py
          python scripts/validate_reference_pipeline_consistency_v1.py
          python scripts/validate_execution_reconciliation_v1.py
          python scripts/validate_qlib_exchange_v1.py
          python scripts/validate_full_research_trial_v1.py
          python scripts/validate_full_research_669_v1.py
          python scripts/validate_selection_integrity_receipts_v1.py
          python scripts/validate_accuracy_correction_hard_stop_v1.py
          python scripts/validate_data_source_audit_v2.py
          python scripts/validate_execution_unit_semantics_v1_2.py
          python scripts/validate_historical_instrument_state_canary_v2.py

  qlib-exchange-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install pinned Qlib runtime
        shell: pwsh
        run: |
          python -m pip install "pytest>=9,<10" "PyYAML>=6,<7"
          python -m pip install "git+https://github.com/microsoft/qlib.git@d5379c520f66a39953bad76234a7019a72796fd0"
      - name: Run Qlib Exchange integration tests
        shell: pwsh
        run: python -m pytest tests/test_qlib_exchange_runtime.py -q
