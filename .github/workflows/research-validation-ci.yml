name: research-validation-ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-classifier:
    name: change-classifier / docs-check
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.changes.outputs.docs_changed }}
      research_code_changed: ${{ steps.changes.outputs.research_code_changed }}
      qlib_changed: ${{ steps.changes.outputs.qlib_changed }}
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Classify changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/ci/classify_changes.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"
      - name: Run fast repository and documentation checks
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/ci/check_docs.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"

  lightweight-contracts:
    needs: change-classifier
    if: needs.change-classifier.outputs.research_code_changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-research-validation.txt
      - name: Install lightweight validation dependencies
        shell: pwsh
        run: python -m pip install -r requirements-research-validation.txt
      - name: Run fast quality tier
        shell: pwsh
        run: python scripts/check_quality.py fast
      - name: Run full quality tier
        shell: pwsh
        run: python scripts/check_quality.py full

  qlib-exchange-runtime:
    needs: change-classifier
    if: needs.change-classifier.outputs.qlib_changed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install pinned Qlib runtime
        shell: pwsh
        run: |
          python -m pip install "pytest>=9,<10" "PyYAML>=6,<7"
          python -m pip install "git+https://github.com/microsoft/qlib.git@d5379c520f66a39953bad76234a7019a72796fd0"
      - name: Run Qlib Exchange integration tests
        shell: pwsh
        run: python scripts/check_quality.py qlib

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - change-classifier
      - lightweight-contracts
      - qlib-exchange-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI tier
        env:
          CLASSIFIER_RESULT: ${{ needs.change-classifier.result }}
          RESEARCH_RESULT: ${{ needs.lightweight-contracts.result }}
          QLIB_RESULT: ${{ needs.qlib-exchange-runtime.result }}
        run: |
          for result in "$CLASSIFIER_RESULT" "$RESEARCH_RESULT" "$QLIB_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "CI tier failed or was cancelled: $result"
                exit 1
                ;;
            esac
          done
          echo "All applicable CI tiers passed."
