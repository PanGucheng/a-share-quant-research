shared_conditions:
- id: minimum_1260_ic_dates
  column: qlib_ic__valid_dates
  transform: raw
  operator: ge
  threshold: 1260
- id: minimum_five_qualified_years
  column: annual_qualified_years
  transform: raw
  operator: ge
  threshold: 5
- id: absolute_mean_rank_ic_002
  column: qlib_ic__mean
  transform: absolute
  operator: ge
  threshold: 0.02
- id: annual_ic_agreement_070
  column: annual_direction_agreement
  transform: raw
  operator: ge
  threshold: 0.7
- id: primary_BH_q_005
  column: fdr_bh_q_value
  transform: raw
  operator: le
  threshold: 0.05
backends:
  alphalens:
  - id: minimum_1260_quantile_dates
    column: alphalens_q5_minus_q1__valid_dates
    transform: raw
    operator: ge
    threshold: 1260
  - id: positive_directional_quantile_spread
    column: alphalens_q5_minus_q1__mean
    transform: direction
    operator: gt
    threshold: 0
  - id: directional_quantile_monotonicity_080
    column: alphalens_quantile_monotonicity_raw
    transform: direction
    operator: ge
    threshold: 0.8
  jqfactor:
  - id: minimum_1260_weighted_return_dates
    column: jqfactor_returns__valid_dates
    transform: raw
    operator: ge
    threshold: 1260
  - id: positive_directional_weighted_return
    column: jqfactor_returns__mean
    transform: direction
    operator: gt
    threshold: 0
  - id: minimum_five_weighted_return_years
    column: jqfactor_return_qualified_years
    transform: raw
    operator: ge
    threshold: 5
  - id: weighted_return_annual_agreement_060
    column: jqfactor_return_annual_direction_agreement
    transform: raw
    operator: ge
    threshold: 0.6
  qlib:
  - id: minimum_1260_long_short_dates
    column: qlib_long_short__valid_dates
    transform: raw
    operator: ge
    threshold: 1260
  - id: positive_directional_Pearson
    column: qlib_pearson__mean
    transform: direction
    operator: gt
    threshold: 0
  - id: positive_directional_long_short
    column: qlib_long_short__mean
    transform: direction
    operator: gt
    threshold: 0
annotations:
  annual_agreement_below: 0.7
  era_absolute_contribution_above: 0.6
  sample_coverage_below: 0.8
  by_q_above: 0.05
missing_policy: any required nonfinite metric or undefined direction => unavailable;
  otherwise any failed condition => fail; unavailable => incomplete agreement
agreement_policy: all three available => pass_count/3; otherwise incomplete; frameworks
  are correlated, not independent confirmations
export_policy: union of backend pass lists for review, no top-N or final core pool
enrichment_policy: 10D and recent diagnostics never enter primary rules
