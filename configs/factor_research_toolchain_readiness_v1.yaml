catalogs:
  - id: "project_main_catalog"
    path: "factor_research/factor_catalog.yaml"
    role: "Project planning catalog and currently registered seed factors."
  - id: "alpha158_full_runnable_catalog"
    path: "outputs/factor_catalog_alpha158_v1/alpha158_catalog_full158_runnable.yaml"
    role: "Promoted Qlib Alpha158 catalog after expression validation and V4 batch evaluation."
  - id: "ta_smoke_passed_catalog"
    path: "outputs/ta_factor_adapter_v1/smoke/ta_factor_catalog_smoke_passed.yaml"
    role: "Promoted smoke-level TA factors after adapter and V4 smoke validation."

source_manifest: "factor_research/external/source_manifest.yaml"
output_dir: "outputs/factor_research_toolchain_readiness_v1/current"

batch_configs:
  - id: "current_seed_batch"
    path: "configs/factor_evaluation_batch_v1.yaml"
  - id: "alpha158_remaining138_batch"
    path: "configs/factor_evaluation_batch_v1_alpha158_remaining138.yaml"

evaluation_configs:
  - id: "factor_evaluation_v4_main"
    path: "configs/factor_evaluation_v4.yaml"

required_output_contracts:
  - id: "alpha158_formula_inventory"
    group: "alpha158_catalog"
    path: "outputs/factor_catalog_alpha158_v1/alpha158_formula_inventory.csv"
    min_rows: 158
  - id: "alpha158_full_runnable_catalog"
    group: "alpha158_catalog"
    path: "outputs/factor_catalog_alpha158_v1/alpha158_catalog_full158_runnable.yaml"
    yaml_key: "factors"
    min_rows: 150
  - id: "alpha158_remaining138_holdout_catalog"
    group: "alpha158_catalog"
    path: "outputs/factor_catalog_alpha158_v1/alpha158_catalog_remaining138_holdout.yaml"
    yaml_key: "factors"
    min_rows: 1
  - id: "alpha158_first20_metric_index"
    group: "open_source_evaluation"
    path: "outputs/factor_evaluation_v4/alpha158_first20_smoke/alpha158_first20_metric_index.csv"
    min_rows: 1
  - id: "alpha158_remaining138_metric_index"
    group: "open_source_evaluation"
    path: "outputs/factor_evaluation_batch_v1/alpha158_remaining138/alpha158_remaining138_metric_index.csv"
    min_rows: 1
  - id: "alpha158_screening_input"
    group: "screening"
    path: "outputs/factor_screening_alpha158_v1/full158/alpha158_factor_screening_input.csv"
    min_rows: 158
  - id: "alpha158_judgement_board"
    group: "screening"
    path: "outputs/factor_judgement_alpha158_v1/full158/alpha158_judgement_board.csv"
    min_rows: 1
  - id: "alpha158_candidate_pool"
    group: "candidate_pool"
    path: "outputs/factor_candidate_pool_alpha158_v1/full158/alpha158_candidate_pool.csv"
    min_rows: 1
  - id: "alpha158_alpha_candidates"
    group: "candidate_pool"
    path: "outputs/factor_candidate_pool_alpha158_v1/full158/alpha158_alpha_candidates.csv"
    min_rows: 1
  - id: "alpha158_main_portfolio_diagnostics"
    group: "portfolio_smoke"
    path: "outputs/alpha158_portfolio_diagnostics_v1/main_2021_2023/single_factor_summary.csv"
    min_rows: 1
  - id: "alpha158_recent_oos_portfolio_diagnostics"
    group: "portfolio_smoke"
    path: "outputs/alpha158_portfolio_diagnostics_v1/recent_oos_2024_2026/single_factor_summary.csv"
    min_rows: 1
  - id: "alpha158_stability_diagnostics"
    group: "stability"
    path: "outputs/alpha158_stability_diagnostics_v1/main_vs_recent_oos/single_factor_stability.csv"
    min_rows: 1
  - id: "ta_adapter_inventory"
    group: "ta_adapter"
    path: "outputs/ta_factor_adapter_v1/smoke/ta_factor_inventory.csv"
    min_rows: 80
  - id: "ta_smoke_passed_catalog"
    group: "ta_adapter"
    path: "outputs/ta_factor_adapter_v1/smoke/ta_factor_catalog_smoke_passed.yaml"
    yaml_key: "factors"
    min_rows: 5
  - id: "ta_smoke_evaluator_status"
    group: "ta_v4_smoke"
    path: "outputs/factor_evaluation_v4/ta_smoke_v1/evaluator_status.csv"
    min_rows: 15
  - id: "ta_smoke_metric_index"
    group: "ta_v4_smoke"
    path: "outputs/factor_evaluation_v4/ta_smoke_v1/open_source_metric_index.csv"
    min_rows: 1
  - id: "ta_smoke_promotion_audit"
    group: "ta_adapter"
    path: "outputs/ta_factor_adapter_v1/smoke/ta_factor_smoke_promotion_audit.csv"
    min_rows: 5

large_scale_rules:
  min_total_runnable_factors: 100
  min_new_source_runnable_factors: 20
  baseline_sources:
    - "qlib_baseline_basic"
    - "qlib_alpha158"
  planned_new_sources:
    - "ta"
    - "kunquant_alpha101"
    - "ginkgo_alpha101"
  required_prefilter:
    - "data_quality"
    - "tradability"
  required_evaluator_systems:
    - "alphalens_reloaded"
    - "jqfactor_analyzer"
    - "qlib_eval"
    - "project_current"
