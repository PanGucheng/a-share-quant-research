large_scale_rules:
  min_total_runnable_factors: 100
  min_new_source_runnable_factors: 20
  baseline_sources:
    - "qlib_baseline_basic"
    - "qlib_alpha158"
  planned_new_sources:
    - "ta"
    - "qlib_alpha360"
    - "kunquant_alpha101"
    - "ginkgo_alpha101"
  required_prefilter:
    - "data_quality"
    - "tradability"
  required_evaluator_systems:
    - "alphalens_reloaded"
    - "jqfactor_analyzer"
    - "qlib_eval"
    - "project_current"
