    path: "outputs/factor_catalog_alpha101_v1/kunquant_alpha101_catalog_metadata.yaml"
    role: "KunQuant Alpha101 metadata catalog after source audit; adapter pending and non-runnable."
  - id: "kunquant_alpha101_promoted_catalog"
    path: "outputs/alpha101_factor_adapter_v1/batch82/alpha101_factor_catalog_promoted64.yaml"
    role: "Promoted KunQuant Alpha101 factors after smoke and candidate71 batch V4 evaluation."
  - id: "qlib_alpha360_smoke_catalog"
    path: "outputs/factor_catalog_alpha360_v1/alpha360_catalog_smoke.yaml"
    role: "Qlib Alpha360 smoke catalog after source audit; disabled/non-runnable until V4 evaluation."
  - id: "qlib_alpha360_batch_candidate_catalog"
    path: "outputs/factor_catalog_alpha360_v1/alpha360_catalog_batch_candidate358.yaml"
    role: "Qlib Alpha360 batch candidate catalog after smoke V4; disabled/non-runnable until batch promotion."
