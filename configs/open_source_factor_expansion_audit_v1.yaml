    license: "GPL-3.0"
    source_type: "a_share_characteristics_reference"
    planned_role: "data_schema_reference"
    reuse_mode: "reference_only_due_gpl_and_data_requirements"
    data_fit: "low"
    adapter_complexity: "high"
    source_files:
      - "char_list.csv"
      - "code/main.py"
      - "code/make_panel.py"
    notes: "Rich A-share characteristics list, but depends on CSMAR-style fundamental tables and GPL code."

  - id: "multi_factor_fundamental_formulas"
