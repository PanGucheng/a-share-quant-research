output_dir: "outputs/open_source_factor_expansion_audit_v1/current"

policy:
  compatible_licenses:
    - "MIT"
    - "Apache-2.0"
    - "BSD"
  caution_licenses:
    - "GPL-3.0"
    - "unknown"
  required_prefilter:
    - "data_quality"
    - "tradability"
  boundary:
    - "Do not copy GPL or unknown-license source code into the project."
    - "Prefer direct Qlib-compatible adapters before adding new data vendors."
    - "Treat fundamental and industry/style candidates as data-audit tasks before factor evaluation."

candidates:
  - id: "qlib_alpha360"
    name: "Qlib Alpha360"
    url: "https://github.com/microsoft/qlib"
    local_path: "E:/qlib_prj/qlib_clone"
    commit: "d5379c520f66a39953bad76234a7019a72796fd0"
    license: "MIT"
    source_type: "price_volume_factor_family"
    planned_role: "next_factor_adapter_candidate"
    reuse_mode: "direct_qlib_expression_adapter"
    data_fit: "high"
    adapter_complexity: "low"
    source_files:
      - "qlib/contrib/data/loader.py"
      - "qlib/contrib/data/handler.py"
    notes: "Uses Qlib-native Alpha360DL/Alpha360 handler and current OHLCV data."

  - id: "factortest_exposure_diagnostics"
    name: "FactorTest"
    url: "https://github.com/CharonChui/FactorTest"
    local_path: "tmp/reference_repos/FactorTest"
    commit: "98cb0e0310a50adc1ca1a34fdd89e18caa03381f"
    license: "MIT"
    source_type: "a_share_evaluator_and_exposure_reference"
    planned_role: "data_and_exposure_adapter_candidate"
    reuse_mode: "reference_then_adapter"
    data_fit: "medium"
    adapter_complexity: "medium"
    source_files:
      - "FactorTestMain.py"
      - "FactorTestBox.py"
      - "FactorTestPerformance.py"
    notes: "Useful for industry/style exposure, Barra correlation, pure-factor and grouped IC diagnostics."

  - id: "get_astock_factors"
    name: "GetAstockFactors"
    url: "https://github.com/hugo2046/GetAstockFactors"
    local_path: "tmp/reference_repos/GetAstockFactors"
    commit: "b1391bd0080b8ec4edba73dafe2fc7fa43329b0c"
    license: "unknown"
    source_type: "a_share_factor_model_data_reference"
    planned_role: "external_factor_return_data_reference"
    reuse_mode: "reference_only_until_license_review"
    data_fit: "external"
    adapter_complexity: "low"
    source_files:
      - "GetAstockFactors.py"
      - "README.md"
    notes: "Fetches FactorWar A-share factor model data; useful as benchmark return series, not stock-level factor values."

  - id: "china_ashare_equity_characteristics"
    name: "China A-Share Equity Characteristics"
