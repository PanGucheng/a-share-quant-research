dependencies:
  - distribution: pyqlib
    import_name: qlib
    role: existing_core
    license: MIT
  - distribution: pandas
    import_name: pandas
    role: existing_core
    license: BSD-3-Clause
  - distribution: numpy
    import_name: numpy
    role: existing_core
    license: BSD-3-Clause
  - distribution: scipy
    import_name: scipy
    role: existing_core
    license: BSD-3-Clause
  - distribution: scikit-learn
    import_name: sklearn
    role: existing_core
    license: BSD-3-Clause
  - distribution: statsmodels
    import_name: statsmodels
    role: research_validation_core
    license: BSD-3-Clause
  - distribution: pandera
    import_name: pandera
    role: phase_1_required
    license: MIT
  - distribution: mlfinpy
    import_name: mlfinpy
    role: phase_3_required
    license: MIT
  - distribution: Riskfolio-Lib
    import_name: riskfolio
    role: optional_portfolio
    license: BSD-3-Clause

expected_metrics:
  total_runnable_factors: 669
  new_source_runnable_factors: 499
  multi_source_screening_rows: 679
  multi_source_judgement_rows: 679
  multi_source_research_candidate_rows: 342
  new_source_alpha_probe_rows: 328
  alpha158_candidate_rows: 14
  alpha360_strict_oos_factor_rows: 3
  liquidity_watchlist_rows: 19
  liquidity_residualized_factor_count: 19
  liquidity_residualized_coverage_min: 0.1495
  liquidity_residualized_required_coverage_min: 0.80
  liquidity_downstream_default_included: 0

command_checks:
  - id: liquidity_residualized_synthetic_validation
    command:
      - scripts/validate_liquidity_residualized_factor_evaluation_v1.py
    expected_exit_codes: [0]
  - id: liquidity_residualized_contract_audit
    command:
      - scripts/audit_liquidity_residualized_factor_evaluation_v1.py
      - --config
      - configs/liquidity_residualized_factor_evaluation_v1.yaml
    expected_exit_codes: [1]
    expected_reason: V3.39 coverage gate is deliberately blocked at 0.1495 below 0.80.
  - id: factor_research_toolchain_readiness
    command:
      - scripts/audit_factor_research_toolchain_v1.py
      - --config
      - configs/factor_research_toolchain_readiness_v1.yaml
    expected_exit_codes: [0]
