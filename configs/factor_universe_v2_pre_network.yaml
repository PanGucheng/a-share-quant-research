    frequency: daily
    history_start: provider_dependent
    update_time: release_or_daily_update
    PIT_semantics: same_day_market_observation
    adjustment_semantics: raw_plus_adjclose_and_factor
    coverage: 6106_instrument_directories_at_v3_6_audit
    reliability: high_for_existing_history
    recommended_use: authoritative_price_volume_amount_vwap
