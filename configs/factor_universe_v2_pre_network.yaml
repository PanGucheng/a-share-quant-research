    provider: community_derived_qlib
    api: instrument_files
    frequency: interval
    history_start: provider_dependent
    update_time: release_or_daily_update
    PIT_semantics: effective_from_to_intervals
    adjustment_semantics: not_applicable
    coverage: all_stock_shsz_and_major_index_universes
    reliability: high_with_existing_universe_audits
    recommended_use: authoritative_membership_and_listing_proxy

