schema_version: 1
contract_id: forward_prediction_entry_contract_v1

calendar:
  authority: admitted_raw_snapshot_manifest
  decision_date_must_exist: true
  label_start_date: program_derived_next_trading_day
  label_start_cutoff: program_derived_09_25_asia_shanghai
  receipt_values_are_non_authoritative: true
  canonical_calendar_sha256_required: true

git_binding:
  prediction_repo_path_required: true
  commit_must_exist: true
  commit_sha_length: 40
  prediction_tree_entry_type: regular_file_blob
  prediction_blob_sha256_must_match: true
  commit_timestamp_source: git_committer_metadata
  commit_timestamp_must_precede_derived_cutoff: true

governance:
  forward_pipeline_code_ready: true
  single_day_feature_pipeline_ready: true
  single_day_prediction_pipeline_ready: true
  label_maturity_tracker_ready: true
  duplicate_prediction_protection_ready: true
  frozen_model_hash_valid: true
  frozen_feature_order_valid: true
  prediction_stage_label_read_count: 0
  official_forward_prediction_count: 0
  primary_confirmation_complete: false
  official_prediction_requires_legal_admission: true
  dry_run_prospective_evidence_eligible: false
  read_forward_label: false
  change_candidate_freeze: false
  forward_data_waiting: true
  production_model_selected: false
  live_trading_ready: false
