  labels:
    - "label_10d_t1"
    - "label_20d_t1"
  factors:
    - "alpha158_KMID"
    - "alpha158_KLEN"
    - "alpha158_KMID2"
    - "alpha158_KUP"
    - "alpha158_KUP2"
    - "alpha158_KLOW"
    - "alpha158_KLOW2"
    - "alpha158_KSFT"
    - "alpha158_KSFT2"
