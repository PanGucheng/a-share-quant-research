version: 1
updated: "2026-06-15"
policy:
  reuse_mode: "coexistence_first"
  adapter_boundary: "Adapters convert data only; metric calculations stay in their source systems."
  required_prefilter:
    - data_quality
    - tradability
  notes:
    - "Do not merge external metrics into a self-designed score until external outputs are reproducible."
    - "Record source project, commit, license, files, functions, and local adaptation for every reused evaluator."

sources:
  - id: alphalens_reloaded
    name: alphalens-reloaded
    local_path: "tmp/reference_repos/alphalens-reloaded"
    commit: "f0a07c22d554e4b4036983cc80320b432714fe7e"
    license: "Apache-2.0"
    planned_role: "Primary open-source factor evaluation reference."
    reuse_policy: "Prefer direct calls or faithful vendoring of evaluation functions; do not change metric definitions."
    source_files:
      - path: "src/alphalens/performance.py"
        functions:
          - "factor_information_coefficient"
          - "mean_information_coefficient"
          - "factor_returns"
          - "factor_alpha_beta"
          - "mean_return_by_quantile"
          - "quantile_turnover"
          - "factor_rank_autocorrelation"
      - path: "src/alphalens/tears.py"
        functions:
          - "create_returns_tear_sheet"
          - "create_information_tear_sheet"
          - "create_turnover_tear_sheet"
    local_adapter: "factor_research/external/adapters.py::to_alphalens_factor_data"
    output_namespace: "alphalens_reloaded"

  - id: jqfactor_analyzer
    name: jqfactor_analyzer
    local_path: "tmp/reference_repos/jqfactor_analyzer"
