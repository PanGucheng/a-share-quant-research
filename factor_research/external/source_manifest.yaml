    license: "MIT"
    planned_role: "A-share style factor analysis reference with group, neutralization, and Chinese reporting conventions."
    reuse_policy: "Prefer direct calls or faithful vendoring of performance/preprocess functions; project supplies Qlib-derived inputs."
    source_files:
      - path: "jqfactor_analyzer/performance.py"
        functions:
          - "factor_information_coefficient"
          - "mean_information_coefficient"
          - "factor_returns"
          - "factor_alpha_beta"
          - "mean_return_by_quantile"
          - "quantile_turnover"
      - path: "jqfactor_analyzer/analyze.py"
        functions:
          - "FactorAnalyzer"
      - path: "jqfactor_analyzer/preprocess.py"
        functions:
          - "winsorize"
          - "standardlize"
          - "neutralize"
    local_adapter: "factor_research/external/adapters.py::to_jqfactor_inputs"
    output_namespace: "jqfactor_analyzer"

  - id: qlib_evaluate
    name: Qlib evaluate
    local_path: "E:/qlib_prj/qlib_clone"
    commit: "d5379c520f66a39953bad76234a7019a72796fd0"
    license: "MIT"
    planned_role: "Keep compatibility with the baseline framework and Qlib-native risk/evaluation tools."
    reuse_policy: "Call Qlib APIs from the installed editable source; do not copy Qlib internals unless necessary."
    source_files:
      - path: "qlib/contrib/evaluate.py"
        functions:
          - "risk_analysis"
          - "indicator_analysis"
          - "long_short_backtest"
    local_adapter: "factor_research/external/adapters.py::to_qlib_score_frame"
    output_namespace: "qlib_eval"

  - id: qlib_factor_platform
