qlib:
  provider_uri: "E:/qlib_prj/qlib_data/cn_data_community_20260609_derived"
  region: "cn"
  freq: "day"

research:
  market: "all_stock_shsz_liquid2000"
  labels:
    - "label_10d_t1"
    - "label_20d_t1"
  bucket_ic_labels:
    - "label_20d_t1"
  quantiles: 5
  min_count: 50
  output_dir: "outputs/factor_research_v2/liquid2000_default"
  legacy_time_slice_root: "outputs/factor_time_slices"
  factor_data_sample_rows: 200

windows:
  - name: "historical_reference_2010_2016"
    start: "2010-01-01"
    end: "2016-12-31"
    sample: "raw"
  - name: "baseline_alignment_2017_2020"
    start: "2017-01-01"
    end: "2020-08-01"
    sample: "raw"
  - name: "main_research_2021_2023"
    start: "2021-01-01"
    end: "2023-12-29"
    sample: "tradable_only"
    tradability_dir: "outputs/tradability/all_stock_shsz_liquid2000_2021-01-01_2023-12-29"
    data_quality_dir: "outputs/data_quality_tradability/all_stock_shsz_liquid2000_2021-01-01_2023-12-29"
  - name: "recent_oos_2024_2026"
    start: "2024-01-01"
    end: "2026-06-09"
    sample: "tradable_only"
    tradability_dir: "outputs/tradability/all_stock_shsz_liquid2000_2024-01-01_2026-06-09"
    data_quality_dir: "outputs/data_quality_tradability/all_stock_shsz_liquid2000_2024-01-01_2026-06-09"

tradable_filter:
  require_can_buy: true
  min_liquidity_bucket: 3
  min_tradability_score: 75
  exclude_quality_statuses:
    - "severe"

selection_rules:
  min_coverage: 0.90
  max_missing_rate: 0.10
  min_main_directional_rank_ic: 0.03
  min_oos_directional_rank_ic: 0.0
  min_rank_ic_win_rate: 0.52
  min_positive_slices: 3
  min_directional_spread: 0.0
  min_monotonicity_score: 0.0
  max_correlation: 0.80
  max_top_quantile_turnover: 1.0
