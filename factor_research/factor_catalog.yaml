version: 1
updated: "2026-06-24"
policy:
  purpose: "Batch factor evaluation catalog for reproducible A-share factor screening."
  principle:
    - "Open-source sources are recorded before large-scale expansion."
    - "Only runnable entries may enter automated evaluation."
    - "Disabled or non-runnable sources are metadata placeholders until their calculation adapters are audited."
  required_prefilter:
    - data_quality
    - tradability

