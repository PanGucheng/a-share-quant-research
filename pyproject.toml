[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qlib-baseline"
version = "0.1.0"
description = "Research-first China A-share quantitative research framework built primarily with Microsoft Qlib"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "PyYAML>=6,<7",
]

[project.scripts]
qlib-daily-update = "qlib_baseline.cli.daily_update:main"
qlib-doctor = "qlib_baseline.cli.doctor:main"
qlib-forward-label-update = "qlib_baseline.cli.forward_label_update:main"
qlib-forward-predict = "qlib_baseline.cli.forward_predict:main"
qlib-forward-status = "qlib_baseline.cli.forward_status:main"
qlib-paper-portfolio = "qlib_baseline.cli.paper_portfolio:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "qlib_baseline*",
  "daily_update*",
  "data_adapters*",
  "data_quality*",
  "data_source_audit*",
  "factor_research*",
  "factor_universe_v2*",
  "model_research*",
  "portfolio*",
  "qlib_integration*",
  "research_validation*",
  "tradability*",
  "universes*",
]
exclude = ["tests*", "tmp*", "outputs*", "artifacts*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["artifacts", "outputs", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
